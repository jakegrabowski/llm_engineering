        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions"

    <script>
        $(document).ready(function () {
            var itemClass;
            console.log("starting data read");
            $.getJSON('./story_gallery.json', function (jsonData) {
                //console.log(jsonData.paragraphs);
                $.each(jsonData.paragraphs, function (index, element) {
                    //console.log(index, element);
                    var totalItems = $(".carousel-item").length;
                    if (totalItems === 0) {
                        itemClass = "carousel-item active";
                    }
                    else {
                        itemClass = "carousel-item";
                    }
                    //     console.log(totalItems);
                    var thisImage = element.imagePath;
                    $('.carousel-inner').append('<div class="' + itemClass + '">' +
                        '<img class="d-block w-100" src="./' + thisImage + '" alt="">' +
                        '<div class="carousel-caption" d-none d-md-block>' +
                        '<p>' + element.storyline + '</p>' +
                        '</div>' + '</div>');

                    $('.carousel-indicators').append('<button type="button" ' + 'data-bs-target="#carouselExampleCaptions" data-bs-slide-to="' + index +
                        '" class="active" aria-current="true" aria-label="Slide ' + index + '"></button>'
                    );
                });
            });
        })
    </script>
